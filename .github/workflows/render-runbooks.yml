name: Render runbooks
on:
  push:
    paths:
      - runbooks/*.md
      - scripts/render_runbooks.py
      - .github/workflows/render-runbooks.yml
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/render_runbooks.py
      - name: Commit rendered pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runbooks/*.html
          if git diff --cached --quiet; then
            echo nothing to commit
          else
            git commit -m "Render runbook HTML pages"
            git push
          fi
